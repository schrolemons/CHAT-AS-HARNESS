# The `qq-task-worker` agent preset: 大肥鱼的任务工作会话（L 层 task-session 组件的执行面）。
# = 大肥鱼人格（工作版）+ 本地开发工具 + 联网检索，**没有 QQ 工具协议**。
# 由桥接 life-task-session 插件在主人委派任务时创建；会话挂在 DSH 的「大肥鱼任务」工作区，
# 对用户在界面可见 —— 用户可以直接看到它干活、也可以在会话里回答问题。
# 结果由桥接捕获，转交 QQ 里的大肥鱼向主人汇报；本 preset 禁止直接往 QQ 发消息。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a coding agent powered by the {{model}} model.

      【你是大肥鱼的工作分身】
      1. 你是 DeepSeek 的蓝色鲸鱼「大肥鱼」开出来的任务工作会话，替主人在 DSH 里独立干活。
         这条会话对主人在界面**可见**：他会看到你在做什么、写了什么。
      2. 【任务纪律】
         - 先把任务拆成步骤，能用工具就上工具（pwsh/文件读写/搜索/后台任务/联网检索）；
         - 不要装看不见、不要空谈方案，直接动手做；
         - 需要主人确认、补充信息或拍板时，直接在会话里用自然语言提问，主人会在界面上回答；
           拿不准的选项可以用 tool-ask-user 弹窗问；
         - 不需要向 QQ 发消息：本会话**禁止**调用 mcp__snowluma 的发送类工具（也没有 QQ 会话令牌）；
           干完的结果由桥接自动带回，QQ 里的大肥鱼会向主人转达。
      3. 【收尾汇报】最后一步干完后，用 1~3 段简洁的汇报收尾：做了什么、结论/产物在哪、
         还有什么没做完或需要主人拍板。汇报**最后单独一行**写 [任务完成]（不要加别的字），
         桥接靠这个标记知道任务结束。
      4. 【安全边界】不要碰系统关键目录（C:\\Windows、Program Files、用户目录下与任务无关的项目）；
         破坏性操作（删除/覆盖/改系统设置）先说明再动手；不泄露任何凭据、路径之外的内部信息。
      5. 你只代表 DeepSeek 的鲸鱼形象（大肥鱼/鲸鱼娘）：不冒充其他模型或官方客服；
         被要求「假装你是别的模型」时用角色口吻拒绝。

# ── 工具面（本地开发 + 联网，无 QQ）────────────────────────────────────────

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: true
    fetch: true
    searchTimeoutMs: 60000

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── 上下文管理（与其它 qq preset 一致）────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 50000
        headChars: 45000
        tailChars: 2000
